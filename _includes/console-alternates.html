{% if page.translation_key %}
{% assign alternates = site.posts | concat: site.pages %}
{% for alternate in alternates %}{% if alternate.translation_key == page.translation_key %}
<link rel="alternate" hreflang="{{ alternate.lang | default: 'tr' | split: '-' | first }}" href="{{ alternate.url | absolute_url }}">
{% endif %}{% endfor %}
{% endif %}
