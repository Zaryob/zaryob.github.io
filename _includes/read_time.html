{% assign words = include.content | number_of_words %}
{% assign minutes = words | divided_by: 135 | at_least: 1 %}
<span class="reading-time" title="Tahmini okuma süresi" data-i18n-title="Estimated read time" data-i18n="{minutes} min read" data-i18n-vars='{"minutes":{{ minutes }}}'>{{ minutes }} dakika okuma süresi</span>
