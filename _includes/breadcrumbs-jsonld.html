{% if page.url != '/' and page.url != '/en/' and page.title and page.title != 'empty' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": {% if page.lang == 'en' %}"Home"{% else %}"Ana Sayfa"{% endif %},
      "item": "{{ '/' | absolute_url }}"
    }
    {% if page.layout == 'post' %}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": {% if page.lang == 'en' %}"Posts"{% else %}"Yazılar"{% endif %},
      "item": "{{ '/posts/' | absolute_url }}"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }},
      "item": "{{ page.url | absolute_url }}"
    }
    {% else %}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.title | jsonify }},
      "item": "{{ page.url | absolute_url }}"
    }
    {% endif %}
  ]
}
</script>
{% endif %}
