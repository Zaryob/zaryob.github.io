---
layout: default
---

<article class="post-layout">
  <div class="post-content">
    {{ content }}
  </div>
  <nav class="post-end-nav" aria-label="Yazı gezinmesi">
    {% if page.medium_url %}<a href="{{ page.medium_url }}" rel="alternate">Medium'daki özgün yazı</a><span aria-hidden="true"> · </span>{% endif %}
    <a href="{{ '/posts/' | relative_url }}">← Tüm yazılar</a>
  </nav>
</article>
