---
layout: default
---

{% assign category = page.permalink | split: '/' | last %}
{% include writing-topics.html %}
<section class="content-section" aria-labelledby="category-heading">
  <div class="section-heading"><h2 id="category-heading"><span data-i18n="Posts in {category}" data-i18n-vars='{"category": {{ page.title_i18n | default: page.title | jsonify | escape }}}'>{{ page.title }} yazıları</span></h2></div>
  <div class="blog-list">
    {% for post in site.categories[category] %}
      {% include post-card.html post=post %}
    {% else %}
      <p><span data-i18n="No posts in this category yet.">Bu kategoride henüz yazı yok.</span></p>
    {% endfor %}
  </div>
</section>
