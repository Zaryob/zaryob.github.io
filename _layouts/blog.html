---
layout: default
---

{% assign category = page.permalink | split: '/' | last %}
<section class="content-section" aria-labelledby="category-heading">
  <div class="section-heading"><h2 id="category-heading">{{ page.title }} yazıları</h2></div>
  <div class="blog-list">
    {% for post in site.categories[category] %}
      {% include post-card.html post=post %}
    {% else %}
      <p>Bu kategoride henüz yazı yok.</p>
    {% endfor %}
  </div>
</section>
