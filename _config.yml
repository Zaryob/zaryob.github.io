social:
  name: Süleyman Poyraz
  links:
    - https://github.com/Zaryob
    - https://linkedin.com/in/suleyman_poyraz
    - https://medium.com/@zaryob

# Social preview for pages without their own image or cover_image.
default_image: /assets/img/pages/home-bg.webp

# No gem theme: github-pages would otherwise add primer's /assets/css/style.css.
theme: null

sass:
  style: compressed

include:
  - _pages

exclude:
  - CONSOLE_THEME.md
  - README.md
  - LICENSE
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts

permalink: /:categories/:title/
markdown: kramdown
paginate: 15
paginate_path: "/posts/page:num/"

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag

# Common Zaryob navigation; override suite_url for a combined local preview.
suite_url: "https://zaryob.github.io"
suite_section: home
