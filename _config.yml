title: Süleyman Poyraz
author:
  name: Süleyman Poyraz
  twitter: pyrz_suleyman
email: zaryob.dev@gmail.com
description: >-
  C++, Linux, ağlar ve yazılım geliştirme üzerine yazılarım, notlarım ve projelerim.
url: https://zaryob.github.io
baseurl: ""
lang: tr
home_pick_count: 3

twitter:
  username: pyrz_suleyman
github_username: Zaryob

social:
  name: Süleyman Poyraz
  links:
    - https://github.com/Zaryob
    - https://linkedin.com/in/suleyman_poyraz
    - https://medium.com/@zaryob

# Social preview for pages without their own image or cover_image.
default_image: /assets/img/social/card-tr.png
default_image_en: /assets/img/social/card-en.png

sass:
  style: compressed
  sourcemap: never
  silence_deprecations:
    - import

include:
  - _pages

exclude:
  - CONSOLE_THEME.md
  - README.md
  - README.tr.md
  - LICENSE
  - LICENSE-CONTENT
  - LICENSES
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts

permalink: /yazilar/:title/
markdown: kramdown
paginate: 15
paginate_path: "/posts/page:num/"

plugins:
  - jekyll-paginate
  - jekyll-seo-tag

# Common Zaryob navigation; override suite_url for a combined local preview.
suite_url: "https://zaryob.github.io"
suite_section: home
